<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"/>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Karla:wght@400;600;700&display=swap" />

    <link rel="shortcut icon" type="image/x-icon" href="photos/logo.png"/>

    <link rel="apple-touch-icon" href="photos/logo.png" />
    <meta name="theme-color" content="#3b2615" />
    <meta name="apple-mobile-web-app-title" content="el Sasu" />
  </head>

  <body>
    <header class="site-nav" id="site-nav">
      <a class="brand" href="#/"><img src="photos/logo.png" alt="" width="44" height="44" /><span>Café el Sasu</span></a>
      <nav class="nav-links" id="nav-links" aria-label="Hauptmenü">
        <a href="#/">Startseite</a>
        <a href="#/speisekarte">Speisekarte</a>
      </nav>
      <div class="nav-actions" id="nav-actions"></div>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Menü öffnen">
        <span></span><span></span><span></span>
      </button>
    </header>

    <main id="view"></main>

    <footer class="site-footer">
      <a class="foot-brand" href="#/"><img src="photos/logo.png" alt="" width="32" height="32" />Café el Sasu</a>
      <nav aria-label="Fußzeile">
        <a href="#/speisekarte">Speisekarte</a>
        <a href="#/konto">Mein Konto</a>
        <a href="mailto:info@cafe-elsasu.de">Kontakt</a>
        <a href="#/bildnachweise">Bildnachweise</a>
      </nav>
      <span class="foot-copy">© 2026 Café el Sasu · Inhaberin Leyla Aksoy</span>
    </footer>

    <template id="tpl-home">
      <header class="opening-hours home-hero">
      <div class="hours-content">
        <h1 id="headline">Wo Kaffee <br />glücklich macht</h1>
        <p class="live" id="live-status" aria-live="polite">&nbsp;</p>
        <p class="pickup" id="next-pickup">&nbsp;</p>
        <div class="hero-actions">
          <a class="btn-cafe" href="#/speisekarte">Jetzt vorbestellen</a>
          <a class="btn-light" id="hero-second" href="#/login">Mitglied werden</a>
        </div>
      </div>
    </header>

    <section class="home-section">
      <div class="home-inner">
        <h2 class="home-title">Beliebt diese Woche</h2>
        <p class="home-sub">Das bestellen unsere Gäste gerade am häufigsten.</p>
        <div class="popular" id="popular"></div>
        <p class="center"><a class="btn-ghost" href="#/speisekarte">Ganze Speisekarte ansehen</a></p>
      </div>
    </section>

    <section class="home-section paper">
      <div class="home-inner">
        <h2 class="home-title">So funktioniert's</h2>
        <ol class="steps">
          <li><h3>Online bestellen</h3><p>Such dir Kaffee und Kuchen aus und wähl eine Abholzeit – frühestens in 15 Minuten.</p></li>
          <li><h3>Wir bereiten zu</h3><p>Du siehst live in deinem Konto, wann deine Bestellung in Arbeit und abholbereit ist.</p></li>
          <li><h3>Abholen &amp; Punkte sammeln</h3><p>Ohne Warten abholen, an der Theke bezahlen. Für jeden Euro gibt's einen Punkt.</p></li>
        </ol>
      </div>
    </section>

    <section class="home-section">
      <div class="home-inner">
        <h2 class="home-title">Treueprogramm</h2>
        <p class="home-sub" id="loyalty-sub">Kostenlos Mitglied werden, Punkte sammeln, gratis genießen.</p>
        <div class="tiers">
          <div class="tier-col Bronze"><h3>Bronze</h3><p class="need">ab 0 Punkten</p><ul><li>1 Punkt pro Euro</li><li>Gratis Gebäck ab 50 Punkten</li><li>Gratis Kaffee ab 100 Punkten</li><li>Gratis Kaffee in deiner Geburtstagswoche</li></ul></div>
          <div class="tier-col Silver"><h3>Silver</h3><p class="need">ab 200 Punkten</p><ul><li>5 % Rabatt auf jede Bestellung</li><li>Gratis Kuchen ab 250 Punkten</li></ul></div>
          <div class="tier-col Gold"><h3>Gold</h3><p class="need">ab 500 Punkten</p><ul><li>10 % Rabatt auf jede Bestellung</li><li>Alles aus Bronze und Silver</li></ul></div>
        </div>
        <p class="center" id="loyalty-cta"><a class="btn-cafe" href="#/login">Kostenlos Mitglied werden</a></p>
      </div>
    </section>

    <section class="about" id="ueber-uns">
      <div class="inner">
        <div>
          <h2>Über uns</h2>
          <p>Willkommen im Café El Sasu in Krefeld! Wir haben dieses Café gegründet, um einen Ort zu schaffen, an dem sich unsere Gäste wohlfühlen, entspannen und hochwertige Getränke und Speisen genießen können.</p>
          <p>Bei uns treffen traditionelle Rezepte auf kreative, moderne Ideen. Wir setzen auf regionale Produkte, nachhaltige Konzepte und einen freundlichen, persönlichen Service – damit jeder Besuch etwas Besonderes ist.</p>
          <p class="owners">Leyla Aksoy, Inhaberin</p>
        </div>
        <img src="photos/background10.jpg" alt="Die Fassade des Café El Sasu mit Markise und Bistrotisch" loading="lazy" />
      </div>
      <div class="gallery">
        <img src="photos/slide1.jpg" alt="Terrasse mit Bistrotischen und Blick über die Stadt" loading="lazy" />
        <img src="photos/slide2.jpg" alt="Der Gastraum mit Theke im Abendlicht" loading="lazy" />
        <img src="photos/slide3.jpg" alt="Balkonplätze mit Vorhängen und Pflanzen" loading="lazy" />
      </div>
    </section>

    <section class="home-section">
      <div class="home-inner visit">
        <div>
          <h2 class="home-title left">Besuch uns</h2>
          <p>Einestraße 1a, 47799 Krefeld</p>
          <table class="hours" id="hours">
            <tr data-days="2,3,4,5"><th>Dienstag – Freitag</th><td>11 – 22 Uhr</td></tr>
            <tr data-days="6,0"><th>Samstag – Sonntag</th><td>10 – 24 Uhr</td></tr>
            <tr data-days="1"><th>Montag</th><td>Ruhetag</td></tr>
          </table>
          <a class="btn-cafe" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&amp;query=Caf%C3%A9+el+Sasu+Krefeld">Bewerte uns auf Google</a>
        </div>
        <iframe title="Karte: Café el Sasu in Krefeld" loading="lazy" src="https://www.google.com/maps?q=47799+Krefeld&amp;z=14&amp;output=embed"></iframe>
      </div>
    </section>
    </template>

    <template id="tpl-speisekarte">
      <header class="menu-hero">
      <h1>Speisekarte</h1>
      <p>Online vorbestellen, in 15 Minuten abholen, Punkte sammeln.</p>
    </header>

    <div class="menu-bar">
      <div class="inner">
        <nav id="cat-nav" aria-label="Kategorien"></nav>
        <label class="sr-only" for="search">Speisekarte durchsuchen</label>
        <input id="search" type="search" placeholder="Suchen…" autocomplete="off" />
        <button class="vegan-chip" type="button" id="vegan-only" aria-pressed="false">Nur vegan</button>
      </div>
    </div>

    <div id="menu-root" aria-live="polite"><p class="menu-empty muted">Speisekarte wird geladen…</p></div>

    <dialog class="item-dialog" id="item-dialog" aria-labelledby="dlg-name">
      <button class="dlg-close" type="button" id="dlg-close" aria-label="Schließen">×</button>
      <img id="dlg-img" alt="" />
      <div class="body">
        <h2 id="dlg-name"></h2>
        <p class="muted" id="dlg-desc"></p>
        <div id="dlg-tags"></div>
        <div id="dlg-mods" class="mod-groups"></div>
        <div class="actions">
          <div class="qty">
            <button type="button" id="dlg-minus" aria-label="Weniger">−</button>
            <span id="dlg-qty">1</span>
            <button type="button" id="dlg-plus" aria-label="Mehr">+</button>
          </div>
          <button class="btn-cafe" type="button" id="dlg-add"></button>
          <button class="star" type="button" id="dlg-fav" hidden aria-label="Als Favorit speichern">☆</button>
        </div>
      </div>
    </dialog>

    <div class="cart-bar" id="cart-bar" hidden>
      <span id="cart-bar-text"></span>
      <a class="btn-cafe" href="#/warenkorb">Zur Kasse</a>
    </div>
    </template>

    <template id="tpl-warenkorb">
      <div class="page">
      <section class="panel">
        <h2>Dein Warenkorb</h2>
        <div id="cart-lines" aria-live="polite"></div>
        <div class="totals" id="totals"></div>
      </section>
      <section class="panel" id="checkout">
        <h2>Abholung</h2>
        <form id="order-form" class="form-cafe">
          <label for="pickup">Abholzeit</label>
          <select id="pickup" required></select>
          <label for="reward">Prämie einlösen</label>
          <select id="reward"><option value="">Keine Prämie</option></select>
          <label for="gift-code">Gutschein-Code <span class="muted">(optional)</span></label>
          <input id="gift-code" placeholder="G-XXXXXXXX" autocomplete="off" />
          <p class="muted" id="discount-note"></p>
          <p class="error" id="error" role="alert"></p>
          <button class="btn-cafe" type="submit" id="place">Vorbestellen – bezahlt wird bei Abholung</button>
        </form>
      </section>
    </div>
    </template>

    <template id="tpl-login">
      <div class="auth">
        <aside class="auth-photo">
          <img src="photos/logo.png" alt="" width="56" height="56" />
          <h1 id="auth-hello">Willkommen zurück</h1>
          <p>Schön, dass du da bist. Dein Kaffee wartet schon.</p>
          <ul class="perks">
            <li>1 Punkt für jeden Euro</li>
            <li>Gratis-Kaffee ab 100 Punkten</li>
            <li>Vorbestellen und ohne Warten abholen</li>
          </ul>
        </aside>

        <div class="auth-card">
          <section id="logged-in" hidden>
            <h2>Du bist eingeloggt</h2>
            <p id="logged-in-as"></p>
            <p class="login-actions"><a class="btn-cafe" id="continue" href="#/konto">Weiter</a></p>
          </section>

          <section id="login-panel">
            <div class="seg" role="tablist" aria-label="Einloggen oder registrieren">
              <button type="button" role="tab" id="mode-login" aria-selected="true">Einloggen</button>
              <button type="button" role="tab" id="mode-register" aria-selected="false">Registrieren</button>
            </div>
            <h2 id="form-title">Einloggen</h2>
            <form id="auth-form" class="form-cafe" novalidate>
              <div id="register-fields" hidden>
                <label for="name">Name</label>
                <input id="name" autocomplete="name" />
                <label for="email">E-Mail</label>
                <input id="email" type="email" autocomplete="email" />
                <label for="birthday">Geburtstag <span class="muted">(optional – für eine Überraschung)</span></label>
                <input id="birthday" type="date" />
              </div>
              <div id="login-fields">
                <label for="id">Mitgliedsnummer oder E-Mail</label>
                <input id="id" autocomplete="username" />
              </div>
              <label for="password">Passwort</label>
              <div class="pw">
                <input id="password" type="password" autocomplete="current-password" />
                <button type="button" id="pw-eye" aria-label="Passwort anzeigen" aria-pressed="false">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
              <p class="error" id="error" role="alert"></p>
              <button class="btn-cafe wide" type="submit" id="submit">Einloggen</button>
            </form>
          </section>
        </div>
      </div>
    </template>

    <template id="tpl-konto">
      <section class="welcome">
      <div class="inner">
        <div>
          <h1 id="greeting">Willkommen</h1>
          <p id="welcome-sub"></p>
        </div>
        <div class="card-col">
          <div class="member-card" id="card"></div>
          <button class="btn-light card-save" type="button" id="card-save">Karte aufs Handy</button>
        </div>
        <dialog class="qr-dialog" id="qr-dialog" aria-labelledby="qr-title">
          <h2 id="qr-title">Deine Mitgliedskarte</h2>
          <img src="/api/me/qr" alt="" width="240" height="240" />
          <p class="mid" id="qr-mid"></p>
          <p class="muted">Zeig den Code an der Theke – wir buchen deine Punkte darauf.</p>
          <button class="btn-cafe" type="button" id="qr-close">Schließen</button>
        </dialog>
      </div>
    </section>

    <div class="page">
      <div class="tabs" role="tablist" id="acc-tabs">
        <button role="tab" id="tab-overview" aria-controls="overview" data-tab="overview">Übersicht</button>
        <button role="tab" id="tab-orders" aria-controls="orders" data-tab="orders">Bestellungen</button>
        <button role="tab" id="tab-beans" aria-controls="beans" data-tab="beans">Bohnen-Abo</button>
        <button role="tab" id="tab-gifts" aria-controls="gifts" data-tab="gifts">Verschenken</button>
        <button role="tab" id="tab-profile" aria-controls="profile" data-tab="profile">Profil</button>
      </div>

      <section role="tabpanel" id="overview" aria-labelledby="tab-overview">
        <div class="bday-banner" id="bday-banner" hidden></div>
        <div id="pulse" aria-live="polite"></div>
        <div class="usual" id="usual" hidden></div>
        <div class="loyalty-row">
          <div class="panel pass" id="pass"></div>
          <div class="panel tier-card" id="tier-card"></div>
        </div>
        <div class="panel" id="fav-panel">
          <h2>Deine Favoriten</h2>
          <div id="favorites"></div>
        </div>
        <div class="stats" id="stats"></div>
        <div class="panel">
          <h2>Prämien</h2>
          <p class="muted">1 Punkt pro Euro, gutgeschrieben bei Abholung. Einlösen kannst du Prämien im Warenkorb.</p>
          <div id="rewards"></div>
        </div>
      </section>

      <section role="tabpanel" id="orders" aria-labelledby="tab-orders" hidden>
        <div class="panel">
          <h2>Bestellverlauf</h2>
          <div id="order-list"></div>
        </div>
      </section>

      <section role="tabpanel" id="beans" aria-labelledby="tab-beans" hidden>
        <div class="panel">
          <h2>Bohnen-Abo</h2>
          <p class="muted">Frisch geröstete ganze Bohnen, regelmäßig für dich zurückgelegt. Abholen und bezahlen im Café – jederzeit pausieren, überspringen oder beenden.</p>
          <form id="bean-form" class="form-cafe bean-form">
            <div><label for="bn-bean">Sorte</label>
              <select id="bn-bean"><option value="espresso">Espresso-Röstung</option><option value="filter">Filter-Röstung</option><option value="decaf">Entkoffeiniert</option></select></div>
            <div><label for="bn-size">Größe</label><select id="bn-size"><option value="250g">250 g</option><option value="1kg">1 kg</option></select></div>
            <div><label for="bn-every">Rhythmus</label>
              <select id="bn-every"><option value="1">jede Woche</option><option value="2" selected>alle 2 Wochen</option><option value="4">alle 4 Wochen</option></select></div>
            <div><label for="bn-first">Erste Abholung</label><input id="bn-first" type="date" required /></div>
            <div><label>&nbsp;</label><button class="btn-cafe" type="submit" id="bn-submit">Abo starten</button></div>
          </form>
          <p class="error" id="bn-error" role="alert"></p>
          <div id="bean-list"></div>
        </div>
      </section>

      <section role="tabpanel" id="gifts" aria-labelledby="tab-gifts" hidden>
        <div class="panel">
          <h2>Kaffee verschenken</h2>
          <p class="muted">Schick jemandem einen Kaffee nach Wahl – per Link oder QR-Code über WhatsApp oder E-Mail.</p>
          <form id="gift-form" class="form-cafe">
            <div class="form-row">
              <div><label for="gf-name">Für wen?</label><input id="gf-name" maxlength="40" required placeholder="Vorname" /></div>
              <div><label for="gf-msg">Nachricht <span class="muted">(optional)</span></label><input id="gf-msg" maxlength="200" placeholder="Danke für alles!" /></div>
            </div>
            <fieldset class="pay-choice"><legend>Bezahlen</legend>
              <label><input type="radio" name="gf-pay" value="points" checked /> <span>Mit 100 Treuepunkten <small id="gf-points"></small></span></label>
              <label><input type="radio" name="gf-pay" value="counter" /> <span>5,00 € an der Theke <small>– wird aktiv, sobald bezahlt</small></span></label>
            </fieldset>
            <p class="error" id="gf-error" role="alert"></p>
            <button class="btn-cafe" type="submit">Gutschein erstellen</button>
          </form>
          <div class="gift-made" id="gift-made" hidden></div>
          <h3>Deine Gutscheine</h3>
          <div id="gift-list"></div>
        </div>
      </section>

      <section role="tabpanel" id="profile" aria-labelledby="tab-profile" hidden>
        <div class="panel">
          <h2>Meine Vorlieben</h2>
          <form id="prefs-form" class="form-cafe">
            <div class="form-row">
              <div><label for="pf-milk">Milch automatisch vorauswählen</label><select id="pf-milk"></select></div>
              <div><label class="check"><input type="checkbox" id="pf-vegan" /> Speisekarte nur mit veganen Optionen öffnen</label></div>
            </div>
            <button class="btn-cafe" type="submit">Vorlieben speichern</button>
          </form>
        </div>
        <div class="panel">
          <h2>Persönliche Daten</h2>
          <form id="profile-form" class="form-cafe">
            <div class="form-row">
              <div><label for="p-name">Name</label><input id="p-name" autocomplete="name" required /></div>
              <div><label for="p-email">E-Mail</label><input id="p-email" type="email" autocomplete="email" required /></div>
              <div><label for="p-birthday">Geburtstag</label><input id="p-birthday" type="date" /></div>
              <div><label for="p-member">Mitgliedsnummer</label><input id="p-member" readonly /></div>
            </div>
            <p class="error" id="profile-error" role="alert"></p>
            <button class="btn-cafe" type="submit">Änderungen speichern</button>
          </form>
        </div>
        <div class="panel">
          <h2>Passwort ändern</h2>
          <form id="password-form" class="form-cafe">
            <div class="form-row">
              <div><label for="pw-current">Aktuelles Passwort</label><input id="pw-current" type="password" autocomplete="current-password" required /></div>
              <div><label for="pw-next">Neues Passwort</label><input id="pw-next" type="password" autocomplete="new-password" minlength="8" required /></div>
            </div>
            <p class="error" id="password-error" role="alert"></p>
            <button class="btn-cafe" type="submit">Passwort ändern</button>
          </form>
        </div>
      </section>
    </div>
    </template>

    <template id="tpl-admin">
      <div class="dash">
        <div class="tabs" id="admin-tabs" role="tablist">
          <button data-tab="kitchen" aria-pressed="true">Küche</button>
          <button data-tab="soldout">Ausverkauft</button>
          <button data-tab="beans">Bohnen</button>
          <button data-tab="finance" data-admin>Finanzen</button>
          <button data-tab="menu" data-admin>Speisekarte</button>
          <button data-tab="team" data-admin>Mitarbeiter</button>
          <button data-tab="shifts" data-admin>Schichten</button>
          <button data-tab="rota">Dienstplan</button>
          <button data-tab="mytime">Meine Zeit</button>
        </div>

        <section class="kds" data-panel="kitchen">
          <div class="kds-bar">
            <button class="kds-toggle" id="t-pause" type="button" aria-pressed="false">
              <strong>Online-Bestellungen</strong><span id="t-pause-state">Aktiv</span>
            </button>
            <button class="kds-toggle" id="t-delay" type="button" aria-pressed="false">
              <strong>Rush: +15 min</strong><span id="t-delay-state">Aus</span>
            </button>
            <form class="kds-lookup" id="lookup-form" autocomplete="off">
              <label for="lookup-id" class="sr-only">Mitgliedsnummer</label>
              <input id="lookup-id" placeholder="Karte / Gutschein scannen oder Nummer" />
              <button class="kds-btn" type="submit">Suchen</button>
              <button class="kds-btn" type="button" id="scan-btn" hidden>Kamera</button>
            </form>
          </div>
          <div class="kds-today" id="kds-today" aria-label="Heute im Dienst"></div>
          <div id="lookup-result" hidden></div>
          <div class="kds-grid" id="open-orders" aria-live="polite"></div>
        </section>

        <dialog class="scan-dialog" id="scan-dialog" aria-labelledby="scan-title">
          <h2 id="scan-title">Mitgliedskarte scannen</h2>
          <video id="scan-video" playsinline muted></video>
          <p class="muted" id="scan-hint">Halte den QR-Code der Karte vor die Kamera.</p>
          <button class="btn-cafe" type="button" id="scan-close">Abbrechen</button>
        </dialog>

        <section class="panel" data-panel="soldout" hidden>
          <h2>Ausverkauft</h2>
          <p class="muted">Ausverkaufte Artikel bleiben auf der Speisekarte sichtbar, können aber nicht bestellt werden.</p>
          <div id="soldout-list"></div>
        </section>

        <section class="panel" data-panel="beans" hidden>
          <h2>Bohnen-Abos</h2>
          <p class="muted">Diese Tüten bitte abfüllen und zurücklegen. Nach der Übergabe auf „Ausgegeben“ tippen – die nächste Abholung wird automatisch geplant.</p>
          <div id="bean-due"></div>
        </section>

        <section class="panel" data-panel="finance" hidden>
          <h2>Finanzen</h2>
          <div class="tabs" id="range">
            <button data-range="day">Heute</button>
            <button data-range="week" aria-pressed="true">7 Tage</button>
            <button data-range="month">30 Tage</button>
          </div>
          <div class="stats" id="stats"></div>
          <h3>Top 5 Artikel</h3>
          <div id="top"></div>
        </section>

        <section class="panel" data-panel="menu" hidden>
          <div class="panel-head"><h2>Speisekarte verwalten</h2><button class="btn-cafe" type="button" id="new-item">Neuer Artikel</button></div>
          <div class="table-scroll"><table class="table admin-table" id="menu-table"></table></div>
        </section>

        <dialog class="edit-dialog" id="item-editor" aria-labelledby="ed-title">
          <form id="editor-form" class="form-cafe" method="dialog">
            <h2 id="ed-title">Artikel bearbeiten</h2>
            <div class="form-row">
              <div><label for="ed-name">Name</label><input id="ed-name" required maxlength="80" /></div>
              <div><label for="ed-price">Preis (€)</label><input id="ed-price" type="number" step="0.01" min="0.01" required /></div>
              <div><label for="ed-cat">Kategorie</label>
                <select id="ed-cat"><option value="coffee">Kaffee</option><option value="cold">Kalt</option><option value="cake">Kuchen</option><option value="pastry">Gebäck</option></select></div>
            </div>
            <label for="ed-desc">Beschreibung</label>
            <input id="ed-desc" maxlength="300" />
            <fieldset class="tag-boxes"><legend>Hinweise</legend>
              <label><input type="checkbox" value="vegan" /> vegan</label>
              <label><input type="checkbox" value="gluten" /> Gluten</label>
              <label><input type="checkbox" value="nuts" /> Nüsse</label>
              <label><input type="checkbox" value="lactose" /> Laktose</label>
            </fieldset>
            <label for="ed-photo">Foto (photos/… oder https://…)</label>
            <div class="photo-row"><input id="ed-photo" /><img id="ed-preview" alt="" /></div>
            <p class="error" id="ed-error" role="alert"></p>
            <div class="login-actions"><button class="btn-cafe" type="submit" id="ed-save">Speichern</button><button class="btn-ghost" type="button" id="ed-cancel">Abbrechen</button></div>
          </form>
        </dialog>

        <section class="panel" data-panel="team" hidden>
          <h2>Mitarbeiterverwaltung</h2>
          <form id="staff-form" class="form-cafe staff-form">
            <div><label for="sf-name">Name</label><input id="sf-name" required /></div>
            <div><label for="sf-email">E-Mail</label><input id="sf-email" type="email" required /></div>
            <div><label for="sf-pw">Temporäres Passwort</label><input id="sf-pw" minlength="8" required autocomplete="new-password" /></div>
            <div><label for="sf-wage">Stundenlohn (€)</label><input id="sf-wage" type="number" step="0.01" min="0" required /></div>
            <div><label>&nbsp;</label><button class="btn-cafe" type="submit">Anlegen</button></div>
          </form>
          <p class="error" id="sf-error" role="alert"></p>
          <div class="table-scroll"><table class="table admin-table" id="team-table"></table></div>
        </section>

        <section class="panel" data-panel="shifts" hidden>
          <h2>Schichten &amp; Personalkosten</h2>
          <div class="tabs" id="shift-range">
            <button data-range="day">Heute</button>
            <button data-range="week" aria-pressed="true">7 Tage</button>
            <button data-range="month">30 Tage</button>
          </div>
          <form class="export-row" id="payroll-form">
            <label for="payroll-month">Lohnabrechnung für</label>
            <input id="payroll-month" type="month" required />
            <a class="btn-cafe" id="payroll-link" href="#">CSV herunterladen</a>
          </form>
          <div class="stats" id="shift-totals"></div>
          <div class="table-scroll"><table class="table admin-table" id="shift-table"></table></div>
        </section>

        <section class="panel" data-panel="rota" hidden>
          <div class="panel-head">
            <h2>Dienstplan</h2>
            <div class="week-nav"><button class="btn-ghost" type="button" id="rota-prev" aria-label="Vorherige Woche">‹</button>
              <strong id="rota-label"></strong>
              <button class="btn-ghost" type="button" id="rota-next" aria-label="Nächste Woche">›</button></div>
          </div>
          <form id="rota-form" class="form-cafe rota-form" data-admin hidden>
            <div><label for="ro-user">Mitarbeiter</label><select id="ro-user" required></select></div>
            <div><label for="ro-date">Tag</label><input id="ro-date" type="date" required /></div>
            <div><label for="ro-start">Von</label><input id="ro-start" type="time" value="10:00" required /></div>
            <div><label for="ro-end">Bis</label><input id="ro-end" type="time" value="16:00" required /></div>
            <div><label for="ro-note">Notiz</label><input id="ro-note" maxlength="80" placeholder="z. B. Frühschicht" /></div>
            <div><label>&nbsp;</label><button class="btn-cafe" type="submit">Eintragen</button></div>
          </form>
          <p class="error" id="ro-error" role="alert"></p>
          <div class="table-scroll"><table class="rota-grid" id="rota-grid"></table></div>
        </section>

        <section class="panel" data-panel="mytime" hidden>
          <h2>Meine Zeit</h2>
          <div class="shift-now" id="shift-now"></div>
          <div class="stats" id="my-stats"></div>
          <h3>Letzte 14 Tage</h3>
          <div class="day-chart" id="day-chart"></div>
          <div class="mytime-cols">
            <div>
              <h3>Meine nächsten Schichten</h3>
              <div id="my-upcoming"></div>
            </div>
            <div>
              <h3>Verlauf</h3>
              <div class="table-scroll"><table class="table admin-table" id="my-history"></table></div>
            </div>
          </div>
        </section>
      </div>
    </template>

    <template id="tpl-gutschein">
      <div class="page" style="max-width:560px">
        <section class="gift-card" id="gift-card"><p class="muted">Gutschein wird geladen…</p></section>
      </div>
    </template>

    <template id="tpl-passwort">
      <div class="page" style="max-width:480px">
        <section class="panel">
          <h2>Eigenes Passwort festlegen</h2>
          <p class="muted">Dein Konto wurde mit einem vorläufigen Passwort angelegt. Bitte lege jetzt dein eigenes fest.</p>
          <form id="pw-form" class="form-cafe">
            <label for="pw-old">Vorläufiges Passwort</label>
            <input id="pw-old" type="password" autocomplete="current-password" required />
            <label for="pw-new">Neues Passwort (mind. 8 Zeichen)</label>
            <input id="pw-new" type="password" autocomplete="new-password" minlength="8" required />
            <label for="pw-new2">Neues Passwort wiederholen</label>
            <input id="pw-new2" type="password" autocomplete="new-password" minlength="8" required />
            <p class="error" id="pw-error" role="alert"></p>
            <button class="btn-cafe wide" type="submit">Passwort speichern</button>
          </form>
        </section>
      </div>
    </template>
