<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Login · Cafe el Sasu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"/>
    <link rel="stylesheet" type="text/css" media="screen" href="main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Karla:wght@400;600;700&display=swap" />
    <link rel="stylesheet" href="shop.css" />
    <link rel="shortcut icon" type="image/x-icon" href="photos/logo.png"/>
  </head>

  <body>
    <!-----------------------------------------------------Navigation Bar-------------------------------------------------->
    <header class="site-nav" id="site-nav">
      <a class="brand" href="index.html"><img src="photos/logo.png" alt="" width="44" height="44" /><span>Café el Sasu</span></a>
      <nav class="nav-links" id="nav-links" aria-label="Hauptmenü">
        <a href="index.html">Startseite</a>
        <a href="menu.html">Speisekarte</a>
      </nav>
      <div class="nav-actions" id="nav-actions"></div>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Menü öffnen">
        <span></span><span></span><span></span>
      </button>
    </header>
    
    <main class="page" style="max-width:480px">
      <section class="panel">
        <h2 id="form-title">Einloggen</h2>
        <form id="auth-form" class="form-cafe" novalidate>
          <div id="register-fields" hidden>
            <label for="name">Name</label>
            <input id="name" autocomplete="name" />
            <label for="email">E-Mail</label>
            <input id="email" type="email" autocomplete="email" />
            <label for="birthday">Geburtstag <span class="muted">(optional, für deine Geburtstagsüberraschung)</span></label>
            <input id="birthday" type="date" />
          </div>
          <div id="login-fields">
            <label for="id">Mitgliedsnummer oder E-Mail</label>
            <input id="id" autocomplete="username" placeholder="SASU-1003" />
          </div>
          <label for="password">Passwort</label>
          <input id="password" type="password" autocomplete="current-password" />
          <p class="error" id="error" role="alert"></p>
          <button class="btn-cafe" type="submit" id="submit" style="width:100%">Einloggen</button>
        </form>
        <p style="margin-top:16px;text-align:center">
          <button class="btn-ghost" id="toggle" type="button">Noch kein Mitglied? Jetzt registrieren</button>
        </p>
        <p class="muted" style="font-size:13px;text-align:center">Demo: SASU-1003 / demo123</p>
      </section>
    </main>

    <!--------------------------------------------------------Footer Section------------------------------------------------->
    <footer class="site-footer">
      <a class="foot-brand" href="index.html"><img src="photos/logo.png" alt="" width="32" height="32" />Café el Sasu</a>
      <nav aria-label="Fußzeile">
        <a href="menu.html">Speisekarte</a>
        <a href="account.html">Mein Konto</a>
        <a href="mailto:info@cafe-elsasu.de">Kontakt</a>
        <a href="credits.html">Bildnachweise</a>
      </nav>
      <span class="foot-copy">© 2026 Görkem Sari &amp; Miraç Subaşı</span>
    </footer>
    <script src="app.js"></script>
    <script src="login.js"></script>
  </body>
</html>
