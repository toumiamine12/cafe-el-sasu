    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Karla:wght@400;600;700&display=swap" />
    <link rel="stylesheet" href="shop.css" />
    <link rel="shortcut icon" type="image/x-icon" href="photos/logo.png"/>
  </head>

  <body>
    <!-----------------------------------------------------Navigation Bar-------------------------------------------------->
    <nav id="navbar" class="navbar navbar-inverse">
      <div class="image">
        <a href="index.html"><img src="photos/logo.png" alt="self" class="self"/></a>
      </div>
      <div class="container-fluid">
        <div class="navbar-header">
          <button type="button" class="navbar-toggle" data-toggle="collapse" data-target="#myNavbar">
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
          </button>
        </div>

        <div class="collapse navbar-collapse" id="myNavbar">
          <ul class="nav navbar-nav navbar-right">
            <li><a href="index.html" class="nav-link normal-link">Startseite</a></li>
            <li><a href="menu.html" class="nav-link normal-link">Speisekarte</a></li>
            <li><a href="index.html#ueber-uns" class="nav-link normal-link">Über uns</a></li>
          </ul>
        </div>
      </div>
    </nav>
    
    <main class="page" style="max-width:480px">
      <section class="panel">
        <h2 id="form-title">Einloggen</h2>
        <form id="auth-form" class="form-cafe" novalidate>
          <div id="register-fields" hidden>
            <label for="name">Name</label>
            <input id="name" autocomplete="name" />
            <label for="email">E-Mail</label>
            <input id="email" type="email" autocomplete="email" />
            <label for="birthday">Geburtstag <span class="muted">(optional, für deine Geburtstagsüberraschung)</span></label>
            <input id="birthday" type="date" />
          </div>
          <div id="login-fields">
            <label for="id">Mitgliedsnummer oder E-Mail</label>
            <input id="id" autocomplete="username" placeholder="SASU-1003" />
          </div>
          <label for="password">Passwort</label>
          <input id="password" type="password" autocomplete="current-password" />
          <p class="error" id="error" role="alert"></p>
          <button class="btn-cafe" type="submit" id="submit" style="width:100%">Einloggen</button>
        </form>
        <p style="margin-top:16px;text-align:center">
          <button class="btn-ghost" id="toggle" type="button">Noch kein Mitglied? Jetzt registrieren</button>
        </p>
        <p class="muted" style="font-size:13px;text-align:center">Demo: SASU-1003 / demo123</p>
      </section>
    </main>

    <!--------------------------------------------------------Footer Section------------------------------------------------->
    <div class="footer">

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <script src="app.js"></script>
    <script src="login.js"></script>
  </body>
</html>
