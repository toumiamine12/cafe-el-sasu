<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Warenkorb · Cafe el Sasu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"/>
    <link rel="stylesheet" type="text/css" media="screen" href="main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Karla:wght@400;600;700&display=swap" />
    <link rel="stylesheet" href="shop.css" />
    <link rel="shortcut icon" type="image/x-icon" href="photos/logo.png"/>
  </head>

  <body>
    <!-----------------------------------------------------Navigation Bar-------------------------------------------------->
    <header class="site-nav" id="site-nav">
      <a class="brand" href="index.html"><img src="photos/logo.png" alt="" width="44" height="44" /><span>Café el Sasu</span></a>
      <nav class="nav-links" id="nav-links" aria-label="Hauptmenü">
        <a href="index.html">Startseite</a>
        <a href="menu.html">Speisekarte</a>
      </nav>
      <div class="nav-actions" id="nav-actions"></div>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="Menü öffnen">
        <span></span><span></span><span></span>
      </button>
    </header>
    
    <main class="page">
      <section class="panel">
        <h2>Dein Warenkorb</h2>
        <div id="cart-lines" aria-live="polite"></div>
        <div class="totals" id="totals"></div>
      </section>
      <section class="panel" id="checkout">
        <h2>Abholung</h2>
        <form id="order-form" class="form-cafe">
          <label for="pickup">Abholzeit</label>
          <select id="pickup" required></select>
          <label for="reward">Prämie einlösen</label>
          <select id="reward"><option value="">Keine Prämie</option></select>
          <p class="muted" id="discount-note"></p>
          <p class="error" id="error" role="alert"></p>
          <button class="btn-cafe" type="submit" id="place">Vorbestellen – bezahlt wird bei Abholung</button>
        </form>
      </section>
    </main>

    <!--------------------------------------------------------Footer Section------------------------------------------------->
    <div class="footer">
      <p class="footer-name">Cafe El Sasu</p>
      <p>Einestraße 1a , 47799 Krefeld</p>
      <p>Email: info@cafe-elsasu.de | Phone: +49 02151 8220</p>
      <p>&copy; Inhaber: Görkem Sari & Mirac Subasi · <a href="credits.html">Bildnachweise</a></p>
    </div>
    <script src="app.js"></script>
    <script src="order.js"></script>
  </body>
</html>
