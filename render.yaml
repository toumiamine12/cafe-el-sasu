services:
  - type: web
    name: cafe-el-sasu
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/menu
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        generateValue: true   # set by Render; read it in the dashboard under Environment
      - key: STAFF_PASSWORD
        generateValue: true
